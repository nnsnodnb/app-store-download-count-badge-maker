[project]
name = "app-store-download-count-badge-maker"
description = "A command-line tool to create badges displaying the number of app downloads from App Store"
authors = [{ name = "nnsnodnb", email = "nnsnodnb@gmail.com" }]
requires-python = ">=3.10,<3.16"
readme = "README.md"
license = "MIT"
keywords = [
    "apple",
    "app store",
    "badge",
    "download count",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pandas>=2.2.2,<3; python_version < '3.11'",
    "pandas>=2.2.2,<3.1; python_version >= '3.11'",
    "PyJWT[crypto]>=2.9.0,<3",
    "PyYAML>=6.0.2,<7",
    "click>=8.1.7,<9",
    "httpx2>=2.12.0",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/nnsnodnb/app-store-download-count-badge-maker"

[project.scripts]
app-store-download-count-badge-maker = "maker.main:cli"

[dependency-groups]
dev = [
    "mypy",
    "invoke",
    "types-pyyaml",
    "pytest-httpx",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "hatch",
    "uv-dynamic-versioning",
    "httpx2-pytest",
]

[tool.hatch.build.targets.sdist]
include = ["maker"]

[tool.hatch.build.targets.wheel]
include = ["maker"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "maker/_version.py"
vsc = "git"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
